<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>日本語トレーニング | 日語學習</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;700&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --washi:#F6F1E4;
    --paper:#FFFDF8;
    --ink:#23324A;
    --ink-soft:#4A5A72;
    --vermillion:#BC4B2C;
    --vermillion-soft:#E7CFC3;
    --moss:#5C6B4F;
    --moss-soft:#DCE3D4;
    --line:#DCD4BE;
    --line-strong:#C9BE9F;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--washi);
    background-image:
      radial-gradient(circle at 1px 1px, rgba(35,50,74,0.05) 1px, transparent 0);
    background-size: 22px 22px;
    color:var(--ink);
    font-family:'Noto Sans TC', 'Noto Sans JP', sans-serif;
    font-size:16px;
    line-height:1.75;
    -webkit-text-size-adjust:100%;
    padding-left:env(safe-area-inset-left);
    padding-right:env(safe-area-inset-right);
  }
  .wrap{max-width:920px;margin:0 auto;padding:32px 20px calc(60px + env(safe-area-inset-bottom));}
  /* 日文假名/漢字內容維持日文字型,筆畫與繁中略有不同 */
  .jp-main, .ex-jp, .pattern-template, .pattern-examples .ex-jp,
  .gj-main, .gj-sub, .gj-head-kana, .gj-label-main{
    font-family:'Noto Sans JP', sans-serif;
  }

  /* ---- Header ---- */
  header{display:flex;align-items:center;gap:18px;margin-bottom:28px;}
  .hanko{
    flex:none;
    width:56px;height:56px;
    background:var(--vermillion);
    color:var(--paper);
    border-radius:6px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Shippori Mincho', serif;
    font-size:30px;font-weight:700;
    transform:rotate(-3deg);
    box-shadow:0 3px 0 rgba(35,50,74,0.15);
  }
  h1{
    font-family:'Shippori Mincho', serif;
    font-size:28px;font-weight:700;margin:0;
    letter-spacing:.02em;
  }
  header p{margin:2px 0 0;color:var(--ink-soft);font-size:15px;}

  /* ---- Tabs ---- */
  nav.tabs{display:flex;border-bottom:1px solid var(--line-strong);margin-bottom:22px;overflow-x:auto;}
  nav.tabs button{
    font-family:'Noto Sans TC','Noto Sans JP',sans-serif;
    background:none;border:none;
    padding:14px 18px;
    min-height:44px;
    font-size:16px;font-weight:500;
    color:var(--ink-soft);
    cursor:pointer;position:relative;
    white-space:nowrap;
  }
  nav.tabs button.active{color:var(--ink);}
  nav.tabs button.active::after{
    content:"";position:absolute;left:14px;right:14px;bottom:-1px;height:3px;
    background:var(--vermillion);border-radius:2px 2px 0 0;
  }

  /* ---- Toolbar ---- */
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:20px;}
  .toolbar input[type=text]{
    flex:1 1 200px;
    padding:12px 14px;
    border:1px solid var(--line-strong);
    border-radius:8px;
    background:var(--paper);
    font-family:inherit;font-size:16px;color:var(--ink);
    min-height:44px;
  }
  .toolbar select{
    padding:12px 12px;border:1px solid var(--line-strong);border-radius:8px;
    background:var(--paper);font-family:inherit;font-size:16px;color:var(--ink);
    min-height:44px;
  }
  .toolbar label.chk{
    display:flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-soft);
    padding:10px;border:1px solid transparent;min-height:44px;
  }
  .toolbar input[type=checkbox]{accent-color:var(--vermillion);width:20px;height:20px;}
  .count-badge{font-size:13px;color:var(--ink-soft);margin-left:auto;padding:9px 2px;}

  /* ---- Section switching ---- */
  section{display:none;}
  section.active{display:block;}

  /* ---- Gojuon table ---- */
  .script-toggle{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap;}
  .script-toggle button{
    font-family:inherit;font-size:14px;padding:10px 16px;border-radius:20px;min-height:44px;
    border:1px solid var(--line-strong);background:var(--paper);color:var(--ink-soft);cursor:pointer;
  }
  .script-toggle button.active{background:var(--ink);color:var(--paper);border-color:var(--ink);}

  .gj-block{margin-bottom:30px;}
  .gj-title{
    font-family:'Shippori Mincho',serif;font-size:16px;color:var(--vermillion);
    margin:0 0 10px;border-bottom:1px solid var(--line);padding-bottom:6px;
  }
  .gj-table{display:grid;gap:6px;}
  .gj-row{display:grid;grid-template-columns:56px repeat(5,1fr);gap:6px;margin-bottom:6px;}
  .gj-head{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-size:13px;color:var(--ink-soft);padding:6px 0;
  }
  .gj-head .gj-head-kana{font-family:'Shippori Mincho',serif;font-size:17px;color:var(--ink);}
  .gj-label{
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    background:var(--moss-soft);border-radius:8px;color:var(--moss);
  }
  .gj-label .gj-label-main{font-family:'Shippori Mincho',serif;font-size:21px;}
  .gj-label .gj-label-rom{font-size:11px;opacity:.85;}
  .gj-cell{
    position:relative;background:var(--paper);border:1px solid var(--line);border-radius:8px;
    padding:10px 4px 8px;text-align:center;min-height:64px;
  }
  .gj-cell.empty{background:transparent;border:1px dashed var(--line);opacity:.35;}
  .gj-cell .gj-main{font-family:'Shippori Mincho',serif;font-size:25px;line-height:1.15;color:var(--ink);}
  .gj-cell .gj-sub{font-size:15px;color:var(--ink-soft);display:block;}
  .gj-cell .gj-rom{font-size:12px;color:var(--vermillion);margin-top:3px;}
  .gj-cell .snd{position:absolute;top:2px;right:2px;width:22px;height:22px;font-size:11px;margin:0;}

  /* ---- Vocab / Grammar / Pattern cards ---- */
  .item-card{
    background:var(--paper);border:1px solid var(--line);border-radius:10px;
    padding:16px 18px;margin-bottom:12px;
  }
  .item-top{display:flex;align-items:flex-start;gap:12px;}
  .item-main{flex:1;}
  .jp-main{font-family:'Shippori Mincho',serif;font-size:22px;color:var(--ink);}
  .jp-main .kanji{margin-left:8px;font-size:16px;color:var(--ink-soft);font-family:'Noto Sans JP',sans-serif;}
  .romaji{font-size:13px;color:var(--vermillion);margin-top:2px;}
  .meaning{font-size:15px;margin-top:4px;color:var(--ink);}
  .level-tag{
    font-size:12px;padding:3px 9px;border-radius:12px;background:var(--moss-soft);color:var(--moss);
    flex:none;align-self:flex-start;
  }
  .known-check{flex:none;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--ink-soft);min-height:44px;justify-content:center;}
  .known-check input{width:22px;height:22px;accent-color:var(--moss);}
  .example{
    margin-top:10px;padding-top:10px;border-top:1px dashed var(--line-strong);
    font-size:13.5px;color:var(--ink-soft);
  }
  .example .ex-jp{color:var(--ink);}

  .grammar-explain{margin-top:8px;font-size:15px;color:var(--ink-soft);display:none;}
  .item-card.open .grammar-explain{display:block;}
  .item-card.grammar{cursor:pointer;}

  .pattern-group{margin-bottom:22px;}
  .pattern-group h3{
    font-family:'Shippori Mincho',serif;font-size:17px;margin:0 0 10px;
    color:var(--vermillion);border-bottom:1px solid var(--line);padding-bottom:6px;
  }
  .pattern-template{font-size:18px;font-family:'Shippori Mincho',serif;color:var(--ink);}
  .pattern-meaning{font-size:14px;color:var(--ink-soft);margin:4px 0 8px;}
  .pattern-examples{list-style:none;margin:0;padding:0;}
  .pattern-examples li{font-size:14.5px;padding:5px 0;color:var(--ink-soft);}

  /* ---- 單詞代換(subs) ---- */
  .subs-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0;}
  .subs-label{font-size:12.5px;color:var(--ink-soft);margin-right:2px;}
  .sub-chip{
    font-family:'Noto Sans JP',sans-serif;font-size:14px;
    padding:6px 12px;border-radius:16px;
    border:1px solid var(--vermillion-soft);background:var(--paper);
    color:var(--vermillion);cursor:pointer;min-height:32px;
  }
  .sub-chip:hover,.sub-chip.active{background:var(--vermillion);color:var(--paper);border-color:var(--vermillion);}
  .sub-preview{
    display:none;align-items:center;gap:6px;
    margin:6px 0 4px;padding:10px 12px;border-radius:8px;
    background:var(--washi);border:1px dashed var(--line-strong);
    font-family:'Noto Sans JP',sans-serif;font-size:16px;color:var(--ink);
  }
  .sub-preview.show{display:flex;}

  .drama-note{font-size:12.5px;color:var(--ink-soft);font-style:italic;margin:2px 0 8px;}

  .beginner-banner{
    background:var(--moss-soft);color:var(--moss);border-radius:10px;
    padding:14px 16px;margin-bottom:22px;font-size:14px;line-height:1.6;
  }
  .beginner-banner b{color:var(--moss);}

  /* ---- 假名注音 (ruby) ---- */
  ruby{font-family:'Noto Sans JP',sans-serif;ruby-position:over;}
  rt{font-size:0.5em;color:var(--ink-soft);font-weight:400;user-select:none;}
  .sub-chip rt{font-size:0.55em;}
  .pattern-examples li .ex-jp{color:var(--ink);margin-right:6px;}

  .empty-note{color:var(--ink-soft);font-size:14px;padding:30px 0;text-align:center;}

  /* ---- Sound button ---- */
  .snd{
    display:inline-flex;align-items:center;justify-content:center;
    width:28px;height:28px;border-radius:50%;
    border:1px solid var(--line-strong);background:var(--washi);
    color:var(--ink-soft);cursor:pointer;flex:none;
    font-size:13px;line-height:1;vertical-align:middle;margin-left:6px;
    transition:background .15s,color .15s,border-color .15s;
  }
  .snd:hover{background:var(--vermillion);border-color:var(--vermillion);color:var(--paper);}
  .snd.playing{background:var(--vermillion);border-color:var(--vermillion);color:var(--paper);}
  .ex-jp .snd,.pattern-template .snd,.jp-main .snd{margin-left:8px;}

  @media (max-width:520px){
    .gj-row{grid-template-columns:42px repeat(5,1fr);gap:4px;}
    .gj-cell .gj-main{font-size:19px;}
    .gj-cell .gj-sub{font-size:11px;}
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="hanko">学</div>
    <div>
      <h1>日本語トレーニング</h1>
      <p>五十音・単語・文法・会話パターン ｜ 給學生使用的日語練習</p>
    </div>
  </header>

  <div class="beginner-banner">
    <b>零基礎學習建議順序:</b>①五十音(先熟悉發音和文字)→②単語 N5 → ③文法 → ④会話パターン。
    所有例句都標了假名注音,看不懂漢字也能直接照著唸。
  </div>

  <div class="script-toggle" id="disp-mode-toggle">
    <span class="subs-label" style="align-self:center;">顯示模式：</span>
    <button data-disp="both" class="active">漢字＋注音</button>
    <button data-disp="kana">純假名</button>
    <button data-disp="kanji">漢字為主</button>
  </div>

  <nav class="tabs">
    <button data-tab="kana" class="active">五十音</button>
    <button data-tab="vocab">単語 (N5)</button>
    <button data-tab="grammar">文法</button>
    <button data-tab="pattern">会話句型</button>
    <button data-tab="drama">日劇台詞</button>
  </nav>

  <!-- KANA -->
  <section id="tab-kana" class="active">
    <div class="script-toggle">
      <button data-script="both" class="active">平假名＋片假名</button>
      <button data-script="hiragana">平假名</button>
      <button data-script="katakana">片假名</button>
    </div>
    <div id="gojuon-wrap"></div>
  </section>

  <!-- VOCAB -->
  <section id="tab-vocab">
    <div class="toolbar">
      <input type="text" id="vocab-search" placeholder="搜尋單字 / 意思 / 例句...">
      <select id="vocab-level">
        <option value="all">全部級數</option>
        <option value="N5">N5</option>
      </select>
      <label class="chk"><input type="checkbox" id="vocab-hide-known"> 隱藏已學</label>
      <span class="count-badge" id="vocab-count"></span>
    </div>
    <div id="vocab-list"></div>
  </section>

  <!-- GRAMMAR -->
  <section id="tab-grammar">
    <div class="toolbar">
      <input type="text" id="grammar-search" placeholder="搜尋文法點...">
      <label class="chk"><input type="checkbox" id="grammar-hide-known"> 隱藏已學</label>
      <span class="count-badge" id="grammar-count"></span>
    </div>
    <div id="grammar-list"></div>
  </section>

  <!-- PATTERN (日常會話句型) -->
  <section id="tab-pattern">
    <div class="toolbar">
      <input type="text" id="pattern-search" placeholder="搜尋句型 / 情境...">
      <select id="pattern-category">
        <option value="all">全部情境</option>
      </select>
      <span class="count-badge" id="pattern-count"></span>
    </div>
    <div id="pattern-list"></div>
  </section>

  <!-- DRAMA (日劇常見台詞) -->
  <section id="tab-drama">
    <div class="toolbar">
      <input type="text" id="drama-search" placeholder="搜尋台詞 / 情境...">
      <span class="count-badge" id="drama-count"></span>
    </div>
    <div id="drama-list"></div>
  </section>

</div>

<script>
/* =========================================================
   資料區
   type: kana / vocab / grammar / pattern
   已學狀態存 localStorage,之後要接 Google Sheets 同步時,
   把 SYNC_URL 換成你的 GAS /exec 網址,並在 pushKnown() /
   pullKnown() 補上 fetch 邏輯(可參考 TOEFL vocab app 的作法)
   ========================================================= */

const SYNC_URL = ""; // TODO: 換成 GAS /exec 網址啟用跨裝置同步

// ---- 五十音 ----
const KANA = [
  // 清音
  {h:'あ',k:'ア',r:'a',g:'seion'},{h:'い',k:'イ',r:'i',g:'seion'},{h:'う',k:'ウ',r:'u',g:'seion'},{h:'え',k:'エ',r:'e',g:'seion'},{h:'お',k:'オ',r:'o',g:'seion'},
  {h:'か',k:'カ',r:'ka',g:'seion'},{h:'き',k:'キ',r:'ki',g:'seion'},{h:'く',k:'ク',r:'ku',g:'seion'},{h:'け',k:'ケ',r:'ke',g:'seion'},{h:'こ',k:'コ',r:'ko',g:'seion'},
  {h:'さ',k:'サ',r:'sa',g:'seion'},{h:'し',k:'シ',r:'shi',g:'seion'},{h:'す',k:'ス',r:'su',g:'seion'},{h:'せ',k:'セ',r:'se',g:'seion'},{h:'そ',k:'ソ',r:'so',g:'seion'},
  {h:'た',k:'タ',r:'ta',g:'seion'},{h:'ち',k:'チ',r:'chi',g:'seion'},{h:'つ',k:'ツ',r:'tsu',g:'seion'},{h:'て',k:'テ',r:'te',g:'seion'},{h:'と',k:'ト',r:'to',g:'seion'},
  {h:'な',k:'ナ',r:'na',g:'seion'},{h:'に',k:'ニ',r:'ni',g:'seion'},{h:'ぬ',k:'ヌ',r:'nu',g:'seion'},{h:'ね',k:'ネ',r:'ne',g:'seion'},{h:'の',k:'ノ',r:'no',g:'seion'},
  {h:'は',k:'ハ',r:'ha',g:'seion'},{h:'ひ',k:'ヒ',r:'hi',g:'seion'},{h:'ふ',k:'フ',r:'fu',g:'seion'},{h:'へ',k:'ヘ',r:'he',g:'seion'},{h:'ほ',k:'ホ',r:'ho',g:'seion'},
  {h:'ま',k:'マ',r:'ma',g:'seion'},{h:'み',k:'ミ',r:'mi',g:'seion'},{h:'む',k:'ム',r:'mu',g:'seion'},{h:'め',k:'メ',r:'me',g:'seion'},{h:'も',k:'モ',r:'mo',g:'seion'},
  {h:'や',k:'ヤ',r:'ya',g:'seion'},{h:'ゆ',k:'ユ',r:'yu',g:'seion'},{h:'よ',k:'ヨ',r:'yo',g:'seion'},
  {h:'ら',k:'ラ',r:'ra',g:'seion'},{h:'り',k:'リ',r:'ri',g:'seion'},{h:'る',k:'ル',r:'ru',g:'seion'},{h:'れ',k:'レ',r:'re',g:'seion'},{h:'ろ',k:'ロ',r:'ro',g:'seion'},
  {h:'わ',k:'ワ',r:'wa',g:'seion'},{h:'を',k:'ヲ',r:'wo',g:'seion'},{h:'ん',k:'ン',r:'n',g:'seion'},
  // 濁音
  {h:'が',k:'ガ',r:'ga',g:'dakuten'},{h:'ぎ',k:'ギ',r:'gi',g:'dakuten'},{h:'ぐ',k:'グ',r:'gu',g:'dakuten'},{h:'げ',k:'ゲ',r:'ge',g:'dakuten'},{h:'ご',k:'ゴ',r:'go',g:'dakuten'},
  {h:'ざ',k:'ザ',r:'za',g:'dakuten'},{h:'じ',k:'ジ',r:'ji',g:'dakuten'},{h:'ず',k:'ズ',r:'zu',g:'dakuten'},{h:'ぜ',k:'ゼ',r:'ze',g:'dakuten'},{h:'ぞ',k:'ゾ',r:'zo',g:'dakuten'},
  {h:'だ',k:'ダ',r:'da',g:'dakuten'},{h:'ぢ',k:'ヂ',r:'ji',g:'dakuten'},{h:'づ',k:'ヅ',r:'zu',g:'dakuten'},{h:'で',k:'デ',r:'de',g:'dakuten'},{h:'ど',k:'ド',r:'do',g:'dakuten'},
  {h:'ば',k:'バ',r:'ba',g:'dakuten'},{h:'び',k:'ビ',r:'bi',g:'dakuten'},{h:'ぶ',k:'ブ',r:'bu',g:'dakuten'},{h:'べ',k:'ベ',r:'be',g:'dakuten'},{h:'ぼ',k:'ボ',r:'bo',g:'dakuten'},
  // 半濁音
  {h:'ぱ',k:'パ',r:'pa',g:'handakuten'},{h:'ぴ',k:'ピ',r:'pi',g:'handakuten'},{h:'ぷ',k:'プ',r:'pu',g:'handakuten'},{h:'ぺ',k:'ペ',r:'pe',g:'handakuten'},{h:'ぽ',k:'ポ',r:'po',g:'handakuten'},
].map((d,i)=>({...d, id:'kana-'+i, type:'kana'}));

// ---- 單字 N5 ----
const VOCAB = [
  {kana:'わたし',kanji:'私',romaji:'watashi',meaning:'我',level:'N5',ex:'{私|わたし}は{学生|がくせい}です。',exMeaning:'我是學生。'},
  {kana:'がっこう',kanji:'学校',romaji:'gakkou',meaning:'學校',level:'N5',ex:'{学校|がっこう}は{九時|くじ}からです。',exMeaning:'學校九點開始。'},
  {kana:'せんせい',kanji:'先生',romaji:'sensei',meaning:'老師',level:'N5',ex:'{田中|たなか}{先生|せんせい}はやさしいです。',exMeaning:'田中老師很和藹。'},
  {kana:'がくせい',kanji:'学生',romaji:'gakusei',meaning:'學生',level:'N5',ex:'{私|わたし}たちは{高校|こうこう}の{学生|がくせい}です。',exMeaning:'我們是高中生。'},
  {kana:'ともだち',kanji:'友達',romaji:'tomodachi',meaning:'朋友',level:'N5',ex:'{友達|ともだち}と{映画|えいが}を{見|み}ます。',exMeaning:'和朋友一起看電影。'},
  {kana:'かぞく',kanji:'家族',romaji:'kazoku',meaning:'家人',level:'N5',ex:'{家族|かぞく}で{旅行|りょこう}に{行|い}きます。',exMeaning:'和家人一起去旅行。'},
  {kana:'たべる',kanji:'食べる',romaji:'taberu',meaning:'吃',level:'N5',ex:'{朝|あさ}ごはんを{食|た}べます。',exMeaning:'吃早餐。'},
  {kana:'のむ',kanji:'飲む',romaji:'nomu',meaning:'喝',level:'N5',ex:'{水|みず}を{飲|の}みます。',exMeaning:'喝水。'},
  {kana:'いく',kanji:'行く',romaji:'iku',meaning:'去',level:'N5',ex:'{学校|がっこう}に{行|い}きます。',exMeaning:'去學校。'},
  {kana:'くる',kanji:'来る',romaji:'kuru',meaning:'來',level:'N5',ex:'{友達|ともだち}が{来|き}ます。',exMeaning:'朋友要來。'},
  {kana:'みる',kanji:'見る',romaji:'miru',meaning:'看',level:'N5',ex:'テレビを{見|み}ます。',exMeaning:'看電視。'},
  {kana:'きく',kanji:'聞く',romaji:'kiku',meaning:'聽 / 問',level:'N5',ex:'{音楽|おんがく}を{聞|き}きます。',exMeaning:'聽音樂。'},
  {kana:'はなす',kanji:'話す',romaji:'hanasu',meaning:'說話',level:'N5',ex:'{先生|せんせい}と{話|はな}します。',exMeaning:'和老師說話。'},

/* =========================================================
   語音朗讀(Web Speech API,免費、不需音檔)
   ========================================================= */
const canSpeak = 'speechSynthesis' in window;
let jaVoice = null;
function loadJaVoice(){
  if(!canSpeak) return;
  const voices = speechSynthesis.getVoices();
  jaVoice = voices.find(v=>v.lang==='ja-JP') || voices.find(v=>v.lang && v.lang.startsWith('ja')) || null;
}
if(canSpeak){
  loadJaVoice();
  speechSynthesis.onvoiceschanged = loadJaVoice;
}
function speak(text, btn){
  if(!canSpeak){ alert('這個瀏覽器不支援語音朗讀功能'); return; }
  speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = 'ja-JP';
  if(jaVoice) utter.voice = jaVoice;
  utter.rate = 0.9;
  if(btn){
    btn.classList.add('playing');
    utter.onend = ()=>btn.classList.remove('playing');
    utter.onerror = ()=>btn.classList.remove('playing');
  }
  speechSynthesis.speak(utter);
}
function sndBtn(text){
  // 用 data-text 存文字,交由事件委派處理,避免字串裡的引號 escape 問題
  return `<span class="snd" data-say="${encodeURIComponent(text)}" title="播放發音">🔊</span>`;
}
document.addEventListener('click', e=>{
  const btn = e.target.closest('.snd');
  if(!btn) return;
  e.stopPropagation();
  speak(decodeURIComponent(btn.dataset.say), btn);
});

/* ---- 假名注音(給完全沒基礎的初學者):{漢字|讀音} 轉成 <ruby> ---- */
function furigana(text){
  if(!text) return '';
  return text.replace(/\{([^{}|]+)\|([^{}|]+)\}/g, '<ruby>$1<rt>$2</rt></ruby>');
}
function stripFurigana(text){
  if(!text) return '';
  return text.replace(/\{([^{}|]+)\|([^{}|]+)\}/g, '$1');
}
/* ---- 顯示模式:漢字+注音(both) / 純假名(kana) / 漢字為主(kanji) ---- */
let dispMode = 'both';
function renderJp(text){
  if(!text) return '';
  if(dispMode==='kana') return text.replace(/\{([^{}|]+)\|([^{}|]+)\}/g, '$2');
  if(dispMode==='kanji') return stripFurigana(text);
  return furigana(text);
}
document.querySelectorAll('#disp-mode-toggle button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('#disp-mode-toggle button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    dispMode = btn.dataset.disp;
    renderVocab(); renderGrammar(); renderPattern(); renderDrama();
  });
});

/* ---- 單詞代換(套用同一個文法/句型架構) ---- */
function subsBlock(template, subs){
  if(!subs || !subs.length) return '';
  return `
    <div class="subs-row" data-template="${encodeURIComponent(template)}">
      <span class="subs-label">套用看看：</span>
      ${subs.map(w=>`<button class="sub-chip" type="button" data-word="${encodeURIComponent(w)}">${renderJp(w)}</button>`).join('')}
    </div>
    <div class="sub-preview"></div>`;
}
document.addEventListener('click', e=>{
  const chip = e.target.closest('.sub-chip');
  if(!chip) return;
  e.stopPropagation();
  const row = chip.closest('.subs-row');
  const preview = row.nextElementSibling;
  if(!preview || !preview.classList.contains('sub-preview')) return;
  const template = decodeURIComponent(row.dataset.template);
  const word = decodeURIComponent(chip.dataset.word);
  const sentenceRaw = template.replace('〜', word);
  row.querySelectorAll('.sub-chip').forEach(c=>c.classList.remove('active'));
  chip.classList.add('active');
  preview.classList.add('show');
  preview.innerHTML = `<span>${renderJp(sentenceRaw)}</span>${sndBtn(stripFurigana(sentenceRaw))}`;
});

const KNOWN_KEY = 'jp_app_known_v1';
let knownMap = JSON.parse(localStorage.getItem(KNOWN_KEY) || '{}');

function isKnown(id){ return !!knownMap[id]; }
function toggleKnown(id, val){
  knownMap[id] = val;
  localStorage.setItem(KNOWN_KEY, JSON.stringify(knownMap));
  pushKnown(id, val); // 之後接 GAS 用
}
function pushKnown(id, val){
  if(!SYNC_URL) return;
  fetch(SYNC_URL, {method:'POST', body: JSON.stringify({id, val})}).catch(()=>{});
}

function renderVocab(){
  const q = document.getElementById('vocab-search').value.trim().toLowerCase();
  const hideKnown = document.getElementById('vocab-hide-known').checked;
  const list = VOCAB.filter(v=>{
    if(hideKnown && isKnown(v.id)) return false;
    if(!q) return true;
    return (v.kana+v.kanji+v.romaji+v.meaning+v.ex+v.exMeaning).toLowerCase().includes(q);
  });
  document.getElementById('vocab-count').textContent = list.length + ' / ' + VOCAB.length + ' 字';
  document.getElementById('vocab-list').innerHTML = list.length ? list.map(v=>{
    let mainHtml;
    if(!v.kanji){
      mainHtml = v.kana;
    } else if(dispMode==='kana'){
      mainHtml = v.kana;
    } else if(dispMode==='kanji'){
      mainHtml = v.kanji + `<span class="kanji">${v.kana}</span>`;
    } else {
      mainHtml = v.kana + `<span class="kanji">${v.kanji}</span>`;
    }
    return `
    <div class="item-card">
      <div class="item-top">
        <div class="item-main">
          <div class="jp-main">${mainHtml}${sndBtn(v.kana)}</div>
          <div class="romaji">${v.romaji}</div>
          <div class="meaning">${v.meaning}</div>
        </div>
        <div class="level-tag">${v.level}</div>
        <div class="known-check">
          <input type="checkbox" data-id="${v.id}" ${isKnown(v.id)?'checked':''}>已學
        </div>
      </div>
      <div class="example"><span class="ex-jp">${renderJp(v.ex)}</span>${sndBtn(stripFurigana(v.ex))} ／ ${v.exMeaning}</div>
    </div>`;
  }).join('') : `<div class="empty-note">沒有符合條件的單字</div>`;
  document.getElementById('vocab-list').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{ toggleKnown(e.target.dataset.id, e.target.checked); renderVocab(); });
  });
}
document.getElementById('vocab-search').addEventListener('input', renderVocab);
document.getElementById('vocab-hide-known').addEventListener('change', renderVocab);
document.getElementById('vocab-level').addEventListener('change', renderVocab);
renderVocab();

/* =========================================================
   文法
   ========================================================= */
function renderGrammar(){
  const q = document.getElementById('grammar-search').value.trim().toLowerCase();
  const hideKnown = document.getElementById('grammar-hide-known').checked;
  const list = GRAMMAR.filter(g=>{
    if(hideKnown && isKnown(g.id)) return false;
    if(!q) return true;
    return (g.title+g.explain+g.ex+g.exMeaning+(g.subs||[]).join('')).toLowerCase().includes(q);
  });
  document.getElementById('grammar-count').textContent = list.length + ' / ' + GRAMMAR.length + ' 點';
  document.getElementById('grammar-list').innerHTML = list.length ? list.map(g=>`
    <div class="item-card grammar" data-id="${g.id}">
      <div class="item-top">
        <div class="item-main">
          <div class="jp-main" style="font-size:19px;">${g.title}</div>
        </div>
        <div class="level-tag">${g.level}</div>
        <div class="known-check">
          <input type="checkbox" data-id="${g.id}" ${isKnown(g.id)?'checked':''} onclick="event.stopPropagation()">已學
        </div>
      </div>
      <div class="grammar-explain">
        <p>${g.explain}</p>
        ${subsBlock(g.slot, g.subs)}
        <div class="example"><span class="ex-jp">${renderJp(g.ex)}</span>${sndBtn(stripFurigana(g.ex))} ／ ${g.exMeaning}</div>
      </div>
    </div>`).join('') : `<div class="empty-note">沒有符合條件的文法點</div>`;
  document.getElementById('grammar-list').querySelectorAll('.item-card').forEach(card=>{
    card.addEventListener('click', e=>{
      if(e.target.closest('.snd') || e.target.closest('.sub-chip') || e.target.closest('.sub-preview')) return;
      card.classList.toggle('open');
    });
  });
  document.getElementById('grammar-list').querySelectorAll('input[type=checkbox]').forEach(cb=>{
    cb.addEventListener('change', e=>{ toggleKnown(e.target.dataset.id, e.target.checked); renderGrammar(); });
  });
}
document.getElementById('grammar-search').addEventListener('input', renderGrammar);
document.getElementById('grammar-hide-known').addEventListener('change', renderGrammar);
renderGrammar();

/* =========================================================
   會話句型
   ========================================================= */
const patternCategories = [...new Set(PATTERNS.map(p=>p.category))];
const catSelect = document.getElementById('pattern-category');
patternCategories.forEach(c=>{
  const opt = document.createElement('option');
  opt.value = c; opt.textContent = c;
  catSelect.appendChild(opt);
});
function renderPattern(){
  const q = document.getElementById('pattern-search').value.trim().toLowerCase();
  const cat = document.getElementById('pattern-category').value;
  const list = PATTERNS.filter(p=>{
    if(cat!=='all' && p.category!==cat) return false;
    if(!q) return true;
    const hay = (p.template+p.meaning+p.category+(p.note||'')+(p.subs||[]).join('')+p.examples.map(e=>e.jp+e.mn).join('')).toLowerCase();
    return hay.includes(q);
  });
  document.getElementById('pattern-count').textContent = list.length + ' / ' + PATTERNS.length + ' 句型';
  // group by category for display
  const groups = {};
  list.forEach(p=>{ (groups[p.category] = groups[p.category]||[]).push(p); });
  const html = Object.keys(groups).map(cat=>`
    <div class="pattern-group">
      <h3>${cat}</h3>
      ${groups[cat].map(patternCardHtml).join('')}
    </div>`).join('');
  document.getElementById('pattern-list').innerHTML = html || `<div class="empty-note">沒有符合條件的句型</div>`;
}
function patternCardHtml(p){
  return `
        <div class="item-card">
          <div class="pattern-template">${renderJp(p.template)}${sndBtn(stripFurigana(p.template))}</div>
          <div class="pattern-meaning">${p.meaning}</div>
          ${p.note ? `<div class="drama-note">${p.note}</div>` : ''}
          ${subsBlock(p.template, p.subs)}
          <ul class="pattern-examples">
            ${p.examples.map(e=>`<li><span class="ex-jp">${renderJp(e.jp)}</span>${sndBtn(stripFurigana(e.jp))} ${e.mn}</li>`).join('')}
          </ul>
        </div>`;
}
document.getElementById('pattern-search').addEventListener('input', renderPattern);
document.getElementById('pattern-category').addEventListener('change', renderPattern);
renderPattern();

/* =========================================================
   日劇常見台詞
   ========================================================= */
function renderDrama(){
  const q = document.getElementById('drama-search').value.trim().toLowerCase();
  const list = DRAMA.filter(p=>{
    if(!q) return true;
    const hay = (p.template+p.meaning+(p.note||'')+p.examples.map(e=>e.jp+e.mn).join('')).toLowerCase();
    return hay.includes(q);
  });
  document.getElementById('drama-count').textContent = list.length + ' / ' + DRAMA.length + ' 句';
  document.getElementById('drama-list').innerHTML = list.length ? list.map(patternCardHtml).join('') : `<div class="empty-note">沒有符合條件的台詞</div>`;
}
document.getElementById('drama-search').addEventListener('input', renderDrama);
renderDrama();

</script>
</body>
